<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Juicy | The Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                } 
            } 
        }
    </script>
    <style>
        body { background-color: #121419; color: #ffffff; -webkit-font-smoothing: antialiased; }

        /* 배경 블러 효과 포인트 */
        .bg-glow-pink {
            position: fixed; top: 0; left: 0; width: 500px; height: 500px;
            background: rgba(220, 150, 200, 0.2); border-radius: 50%; filter: blur(100px); z-index: -1;
        }
        .bg-glow-cyan {
            position: fixed; bottom: 10%; right: 0; width: 400px; height: 400px;
            background: rgba(100, 230, 230, 0.2); border-radius: 50%; filter: blur(100px); z-index: -1;
        }

        /* 베이스 카드와 오브젝트 공통 스타일 */
        .nft-card {
            position: relative; border-radius: 32px; overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            background: rgba(26, 29, 36, 0.8);
            border-width: 2px; border-color: rgba(255, 255, 255, 0.05);
            height: 360px; /* 고정 높이 */
        }
        .nft-card:hover { transform: translateY(-8px); border-color: rgba(255, 255, 255, 0.2); }

        /* 등급별 테두리 및 그림자 (카드 단위) */
        .card-border-common { border-color: rgba(255, 255, 255, 0.1); }
        .card-border-common:hover { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 10px 30px -10px rgba(255,255,255,0.1); }

        .card-border-rare { border-color: #9CE2E8; }
        .card-border-rare:hover { border-color: #A5F3FC; box-shadow: 0 10px 30px -10px rgba(156,226,232,0.3); }

        .card-border-ultra { border-color: #D4AF37; }
        .card-border-ultra:hover { border-color: #FAD982; box-shadow: 0 10px 30px -10px rgba(212,175,55,0.5); }

        /* 레어 카드 전용 배경 (네이비-블루 틴트) */
        .rare-card { background: linear-gradient(160deg, #1E2D3D, #111A24); }

        /* 메인 에셋 이미지 positioning */
        .nft-image {
            position: absolute; left: 50%; transform: translateX(-50%);
            object-fit: contain; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        /* 1. 헤드(과일) 이미지 기준점: 하단 120px / 높이 200px */
        .nft-card:not(.outfit-card) .nft-image { bottom: 120px; height: 200px; }
        
        /* 2. 옷 이미지 기준점: 하단 120px 고정 + 크기 1.75배 확대 (약 280px) */
        .outfit-card .nft-image { bottom: 120px; height: 280px; top: auto; }
        
        /* 호버 시 애니메이션 (크기 살짝 커지고 위로 올라감) */
        .nft-card:not(.outfit-card):hover .nft-image { height: 210px; bottom: 125px; }
        .outfit-card:hover .nft-image { height: 290px; bottom: 125px; }

        /* 플로팅 글래스 뱃지 */
        .glass-badge {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border-radius: 99px;
            padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.2);
            color: #EFEFF5; font-size: 11px; font-weight: 700;
        }
        .badge-common { color: #EFEFF5; border-color: rgba(255,255,255,0.2); }
        .badge-rare { color: #9CE2E8; border-color: rgba(156,226,232,0.4); }
        .badge-ultra { color: #D4AF37; border-color: rgba(212,175,55,0.6); }

        .glass-circle {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border-radius: 50%;
            width: 36px; height: 36px; border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; cursor: pointer; transition: background 0.3s;
        }
        .glass-circle:hover { background: rgba(255, 255, 255, 0.25); }

        /* 하단 그라데이션 오버레이 및 정보 영역 */
        .card-bottom-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 50px 20px 24px 20px; z-index: 10;
        }
        .nft-card.ultra-card .card-bottom-info {
            background: linear-gradient(to top, rgba(21, 23, 29, 0.98) 0%, rgba(26, 29, 36, 0.95) 50%, transparent 100%);
        }
        .nft-card:not(.ultra-card) .card-bottom-info {
            background: linear-gradient(to top, rgba(21, 23, 29, 0.95) 0%, rgba(26, 29, 36, 0.8) 50%, transparent 100%);
        }

        /* 하얀색 액션 버튼 */
        .action-btn {
            color: #16181D; font-weight: 800; font-size: 13px;
            padding: 12px 20px; border-radius: 99px; text-align: center;
            transition: all 0.3s; white-space: nowrap;
        }
        .glass-btn { background: rgba(255, 255, 255, 0.9); }
        .glass-btn:hover { background: #ffffff; transform: scale(1.05); }
        .gold-btn { background: linear-gradient(90deg, #D4AF37, #FAD982); }
        .gold-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }

        /* 카테고리 탭 */
        .pill-tab {
            padding: 10px 20px; border-radius: 99px;
            font-size: 13px; font-weight: 700; transition: all 0.3s ease;
            white-space: nowrap; cursor: pointer;
        }
        .tab-active { background: white; color: #16181D; }
        .tab-inactive { background: rgba(255, 255, 255, 0.05); color: rgba(255,255,255,0.6); }
        .tab-inactive:hover { background: rgba(255, 255, 255, 0.1); color: white; }

        /* 아코디언 */
        .expand-grid { display: none; opacity: 0; transform: translateY(-10px); transition: 0.4s ease; }
        .expand-grid.active { display: grid; opacity: 1; transform: translateY(0); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 텍스트 그라데이션 */
        .text-gradient-ultra {
            background: linear-gradient(to right, #FAD982, #D4AF37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* 🚨 푸터 및 소셜 아이콘 전용 스타일 */
        .footer-title {
            font-weight: 800; font-size: 16px; letter-spacing: -0.05em;
            background: linear-gradient(180deg, #EFEFF5 0%, #AAAABC 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-social-group a {
            color: rgba(255,255,255,0.7); transition: all 0.3s ease;
        }
        .header-social-group a:hover {
            color: white; transform: translateY(-2px);
        }
        /* Custom style for X icon size alignment */
        .x-icon { height: 16px !important; width: 16px !important; }
    </style>
</head>

                <svg role="img" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1971.3728.2914a.077.077 0 01-.0066.1278 12.2923 12.2923 0 01-1.8722.8923.076.076 0 00-.0416.1061c.353.699.7644 1.3638 1.226 1.9942a.0775.0775 0 00.0842.028c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077 lap0-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.419-2.1568 2.419zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.419-2.1568 2.419z"/></svg>

        </div>
    </header>

    <div class="mb-8 relative z-40">
        <div class="bg-nav-bg rounded-full py-4 px-6 flex items-center gap-3 border border-white/5">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search NFT or artist name..." class="bg-transparent border-none outline-none text-sm w-full text-white placeholder-gray-500 font-medium">

    <div class="mb-8 flex gap-3 overflow-x-auto no-scrollbar z-40 relative">

    <main class="relative z-10 pb-40 px-6 max-w-screen-xl mx-auto">

            <div id="outfits-tab-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div id="sec-ultra" class="section-container hidden">

            </div>
            <div id="ultra-heads-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-16"></div>
            
            <div class="flex items-center gap-3 mb-6 px-2">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#FAD982"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg>
                <h3 class="text-2xl font-black text-gradient-ultra tracking-tight">Ultra Outfits</h3>
            </div>
            <div id="ultra-outfits-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

    <footer class="mt-32 mb-16 pb-16 text-center relative z-40 px-6 max-w-screen-xl mx-auto border-t border-white/5 pt-16">
        <p class="text-xs text-gray-500 font-semibold uppercase tracking-widest mb-2">Next Chapter</p>
        <p class="text-sm text-gray-300 font-semibold mb-1">coming soon 시즌 2</p>
        <p class="footer-title font-extrabold text-xl tracking-tighter">Inner Juicy: THE OVERFLOW</p>
    </footer>

    <script>
        // 오픈씨 컬렉션 링크 생성 함수
        const COLLECTION_URL = "https://opensea.io/collection/inner-juicy";
        function getOpenseaLink(trait, value) {
            return `${COLLECTION_URL}?search[stringTraits][0][name]=${trait}&search[stringTraits][0][values][0]=${encodeURIComponent(value)}`;
        }

        // SVG 아이콘들
        const ethSvg = `<svg width="10" height="14" viewBox="0 0 320 512" fill="currentColor"><path d="M311.9 260.8L160 353.6 8 260.8 160 0l151.9 260.8zM160 383.4L8 290.6 160 512l152-221.4-152 92.8z"/></svg>`;
        const ethBadgeSvg = `<svg width="12" height="16" viewBox="0 0 320 512" fill="currentColor"><path d="M311.9 260.8L160 353.6 8 260.8 160 0l151.9 260.8z"/></svg>`;
        const heartSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;

        // 등급별 설정
        const tierConfig = {
            common: {
                badgeClass: 'badge-common', tierName: 'Common', priceIconColor: 'white', 
                bidText: 'View Item', bidClass: 'glass-btn', borderClass: 'card-border-common'
            },
            rare: {
                badgeClass: 'badge-rare', tierName: 'Limited', titleColor: '#9CE2E8', 
                priceIconColor: '#9CE2E8', bidText: 'Place Bid', bidClass: 'glass-btn', borderClass: 'card-border-rare'
            },
            ultra: {
                badgeClass: 'badge-ultra', tierName: 'Masterpiece', titleColor: '#FAD982', 
                priceIconColor: '#D4AF37', bidText: 'Make Bid', bidClass: 'gold-btn', borderClass: 'card-border-ultra'
            }
        };

        // 레퍼런스 스타일 카드 생성 함수
        function createCardHTML(config) {
            const { tier, imgSrc, title, subtitle, link, fullNami, isOutfit, customBadge } = config;
            const t = tierConfig[tier];
            
            // 🚨 옷 카드는 전용 클래스 추가 (크기 확대 및 하단 정렬)
            const outfitClass = isOutfit ? 'outfit-card' : '';
            // 울트라 탭 Heads는 [과일명] [속성명]으로 표시
            const mainTitle = fullNami || title;
            // 옷 카드는 subtitle에 등급 이름 명시
            const mainSubtitle = isOutfit ? `${t.tierName} OUTFIT` : subtitle;
            const badgeText = customBadge || t.tierName;

            return `
                <div class="nft-card ${t.borderClass} ${tier}-card ${outfitClass}">
                    <div class="absolute top-4 left-4 z-20 glass-badge ${t.badgeClass}">
                        ${ethBadgeSvg}
                        <div class="flex flex-col leading-none text-left">
                            <span class="text-[9px] opacity-70 mb-[1px]">Rarity</span>
                            <span class="tracking-wide">${badgeText}</span>
                        </div>
                    </div>
                    <div class="glass-circle absolute top-4 right-4 z-20 flex justify-center items-center" style="color: ${t.titleColor || 'white'}">
                        ${heartSvg}
                    </div>

                    <img src="${imgSrc}" class="nft-image" onerror="this.src='https://via.placeholder.com/300x400/2A2D36/FFFFFF?text=Image+Missing'">

                    <div class="card-bottom-info flex-col">
                        <div>
                            <h4 class="text-white text-2xl font-black tracking-tight leading-none mb-1.5" style="color: ${t.titleColor || 'white'}">${mainTitle}</h4>
                            <p class="text-gray-300 text-[11px] font-semibold uppercase tracking-wider">${mainSubtitle}</p>
                        </div>
                        <div class="flex items-end justify-between mt-3">
                            <div>
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">Current Price</p>
                                <p class="text-base font-black flex items-center gap-1.5" style="color: ${t.priceIconColor}">
                                    ${ethSvg} Open Offer
                                </p>
                            </div>
                            <a href="${link}" target="_blank" class="action-btn ${t.bidClass}">
                                ${t.bidText}
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 1. HEADS 데이터 세팅 (울트라 속성명 동적 매핑 이전 내용 유지)
        // ==========================================
        const fruits = [
            { id: 'apple', name: 'Apple', u1: {file: 'crimson', label: 'Crimson'}, u2: {file: 'solar', label: 'Solar'} },
            { id: 'banana', name: 'Banana', u1: {file: 'aurora', label: 'Aurora'}, u2: {file: 'void', label: 'Void'} },
            { id: 'strawberry', name: 'Strawberry', u1: {file: 'neon', label: 'Neon'}, u2: {file: 'obsidian', label: 'Obsidian'} },
            { id: 'kiwi', name: 'Kiwi', u1: {file: 'solar', label: 'Solar'}, u2: {file: 'neon', label: 'Neon'} },
            { id: 'lemon', name: 'Lemon', u1: {file: 'crystal', label: 'Crystal'}, u2: {file: 'electric', label: 'Electric'} },
            { id: 'melon', name: 'Melon', u1: {file: 'toxic', label: 'Toxic'}, u2: {file: 'ice', label: 'Ice'} },
            { id: 'blueberry', name: 'Blueberry', u1: {file: 'ice', label: 'Ice'}, u2: {file: 'galaxy', label: 'Galaxy'} },
            { id: 'peach', name: 'Peach', u1: {file: 'cream', label: 'Cream'}, u2: {file: 'sunset', label: 'Sunset'} },
            { id: 'watermelon', name: 'Watermelon', u1: {file: 'darkmatter', label: 'Darkmatter'}, u2: {file: 'chroma', label: 'Chroma'} },
            { id: 'orange', name: 'Orange', u1: {file: 'amber', label: 'Amber'}, u2: {file: 'molten', label: 'Molten'} },
            { id: 'pineapple', name: 'Pineapple', u1: {file: 'diamond', label: 'Diamond'}, u2: {file: 'plasma', label: 'Plasma'} }
        ];

        const fruitContainer = document.getElementById('dynamic-fruits-container');
        fruits.forEach(f => {
            fruitContainer.innerHTML += `
                <div class="bg-nav-bg rounded-[28px] p-5 cursor-pointer hover:bg-[#20242D] transition-all border border-white/5 col-span-full flex justify-between items-center group shadow-lg" onclick="toggleExpand('grid-${f.id}')">
                    <div class="flex items-center gap-5">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#1A1D24] to-[#121419] flex items-center justify-center p-1 relative overflow-hidden">
                            <img src="./images/${f.id}-common.png" class="w-full object-contain transform group-hover:scale-110 transition duration-500">
                        </div>
                        <div>
                            <h3 class="text-xl font-black text-white group-hover:text-pink-300 transition-colors">${f.name} Archive</h3>
                            <p class="text-[11px] text-gray-400 uppercase tracking-widest font-bold mt-1">Tap to Expand</p>
                        </div>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-gray-400 group-hover:text-white group-hover:bg-white/20 transition">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
                <div id="grid-${f.id}" class="expand-grid col-span-full grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8 pt-2">
                    ${renderHeadItems(f)}
                </div>
            `;
        });

        function renderHeadItems(f) {
            const os = getOpenseaLink('fruit_head', f.name);
            const basicSubtitle = 'By Inner Juicy';
            return `
                ${createCardHTML({ tier: 'common', customBadge: 'Common & Rare Base', imgSrc: `./images/${f.id}-common.png`, title: `${f.name} Core`, subtitle: basicSubtitle, link: os })}
                ${createCardHTML({ tier: 'rare', customBadge: 'Rare Head', imgSrc: `./images/${f.id}-rare-headset.png`, title: `${f.name} Headset`, subtitle: basicSubtitle, link: os })}
                ${createCardHTML({ tier: 'rare', customBadge: 'Rare Head', imgSrc: `./images/${f.id}-rare-sunglasses.png`, title: `${f.name} Sunglasses`, subtitle: basicSubtitle, link: os })}
                ${createCardHTML({ tier: 'ultra', imgSrc: `./images/${f.id}-ultra-${f.u1.file}.png`, fullNami: `${f.name} ${f.u1.label}`, subtitle: basicSubtitle, link: getOpenseaLink('ultra_head', f.u1.label) })}
                ${createCardHTML({ tier: 'ultra', imgSrc: `./images/${f.id}-ultra-${f.u2.file}.png`, fullNami: `${f.name} ${f.u2.label}`, subtitle: basicSubtitle, link: getOpenseaLink('ultra_head', f.u2.label) })}
            `;
        }

        // ==========================================
        // 2. OUTFITS 데이터 세팅
        // ==========================================
        const outfitFiles = [
            // 🚨 수정됨: 깃허브 스크린샷 기반 모든 파일명 동기화 및 오타 수정 완료
            {t:'Astronaut Candy', f:'astronaut-candy.png', r:'rare'},
            {t:'Astronaut Handshake', f:'astronaut-handshake.png', r:'rare'},
            {t:'Astronaut Suit', f:'astronaut-suit.png', r:'rare'},
            {t:'Astronaut Wave', f:'astronaut-wave.png', r:'rare'},
            {t:'Crystal Mage', f:'outfit-crystal-mage.png', r:'ultra'},
            {t:'Cyberpunk Jacket', f:'outfit-cyberpunk-jacket.png', r:'ultra'},
            {t:'Dragon Armor', f:'outfit-dragon-armor.png', r:'ultra'},
            {t:'Gold Astronaut', f:'outfit-gold-astronaut.png', r:'ultra'},
            {t:'Green Sweater 1', f:'green-sweater-1.png', r:'common'},
            {t:'Green Sweater 2', f:'green-sweater-2.png', r:'common'},
            {t:'Green Sweater 3', f:'green-sweater-3.png', r:'common'},
            {t:'Green Sweater 4', f:'green-sweater-4.png', r:'common'},
            {t:'Hoodie 1', f:'hoodie-1.png', r:'common'},
            {t:'Hoodie 2', f:'hoodie-2.png', r:'common'},
            {t:'Hoodie 3', f:'hoodie-3.png', r:'common'},
            {t:'Hoodie 4', f:'hoodie-4.png', r:'common'},
            {t:'Hoodie 5', f:'hoodie-5.png', r:'common'},
            {t:'Hoodie 6', f:'hoodie-6.png', r:'common'},
            {t:'Jungle Vest', f:'outfit-jungle-vest.png', r:'ultra'},
            {t:'Leather Jacket Candy', f:'leather-jacket-candy.png', r:'rare'},
            {t:'Leather Jacket Handshake', f:'leather-jacket-handshake.png', r:'rare'},
            {t:'Leather Jacket Shrug', f:'leather-jacket-shrug.png', r:'rare'},
            {t:'Leather Jacket', f:'leather-jacket.png', r:'rare'},
            {t:'Navy Sweater 1', f:'navy-sweater-1.png', r:'common'},
            {t:'Navy Sweater 2', f:'navy-sweater-2.png', r:'common'},
            {t:'Navy Sweater 3', f:'navy-sweater-3.png', r:'common'},
            {t:'Navy Sweater 4', f:'navy-sweater-4.png', r:'common'},
            {t:'Navy Sweater 5', f:'navy-sweater-5.png', r:'common'},
            {t:'Navy Sweater 6', f:'navy-sweater-6.png', r:'common'},
            {t:'Nebula Hood', f:'outfit-nebula-hood.png', r:'ultra'},
            {t:'Pharaoh', f:'outfit-pharaoh.png', r:'ultra'},
            {t:'Royal Robe', f:'outfit-royal-robe.png', r:'ultra'},
            {t:'Spiked Punk', f:'outfit-spiked-punk.png', r:'ultra'},
            {t:'Steampunk Vest', f:'outfit-steampunk-vest.png', r:'ultra'},
            {t:'Work Jacket Candy', f:'work-jacket-candy.png', r:'rare'},
            {t:'Work Jacket Cross', f:'work-jacket-cross.png', r:'rare'},
            {t:'Work Jacket Offer', f:'work-jacket-offer.png', r:'rare'},
            {t:'Work Jacket', f:'work-jacket.png', r:'rare'}
        ];

        const outfitGrid = document.getElementById('outfits-tab-grid');
        outfitFiles.forEach(item => {
            // 🚨 isOutfit: true 옵션을 주어 크기가 1.75배 크고 바닥 라인이 일치되도록 함
            outfitGrid.innerHTML += createCardHTML({ 
                tier: item.r, imgSrc: `./images/${item.f}`, 
                title: item.t, subtitle: '', 
                link: getOpenseaLink(item.r === 'ultra' ? 'outfit' : 'outfits', item.t),
                isOutfit: true 
            });
        });

        // ==========================================
        // 3. ULTRA Archive 세팅 (헤드 22종 + 옷 10종 이전 내용 유지)
        // ==========================================
        const ultraHeadsGrid = document.getElementById('ultra-heads-grid');
        fruits.forEach(f => {
            ultraHeadsGrid.innerHTML += createCardHTML({ 
                tier: 'ultra', imgSrc: `./images/${f.id}-ultra-${f.u1.file}.png`, 
                fullNami: `${f.name} ${f.u1.label}`, subtitle: 'Ultra Head', 
                link: getOpenseaLink('ultra_head', f.u1.label)
            });
            ultraHeadsGrid.innerHTML += createCardHTML({ 
                tier: 'ultra', imgSrc: `./images/${f.id}-ultra-${f.u2.file}.png`, 
                fullNami: `${f.name} ${f.u2.label}`, subtitle: 'Ultra Head', 
                link: getOpenseaLink('ultra_head', f.u2.label)
            });
        });

        const ultraTabOutfitGrid = document.getElementById('ultra-outfits-grid');
        outfitFiles.filter(item => item.r === 'ultra').forEach(item => {
            ultraTabOutfitGrid.innerHTML += createCardHTML({ 
                tier: 'ultra', imgSrc: `./images/${item.f}`, 
                title: item.t, subtitle: '', 
                link: getOpenseaLink('outfit', item.t),
                isOutfit: true 
            });
        });

        // 탭 및 아코디언 로직
        function switchTab(tab) {
            document.querySelectorAll('.section-container').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('.pill-tab').forEach(b => {
                b.classList.remove('tab-active');
                b.classList.add('tab-inactive');
            });
            
            const activeBtn = document.getElementById(`btn-${tab}`);
            activeBtn.classList.remove('tab-inactive');
            activeBtn.classList.add('tab-active');
        }

        function toggleExpand(id) {
            const el = document.getElementById(id);
            el.classList.toggle('active');
            const svg = event.currentTarget.querySelector('svg');
            if (el.classList.contains('active')) {
                svg.style.transform = 'rotate(180deg)';
                svg.style.transition = 'transform 0.3s ease';
            } else {
                svg.style.transform = 'rotate(0deg)';
            }
        }
    </script>
</body>
