<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Juicy | The Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'app-bg': '#191C26',
                        'card-bg': '#242837',
                        'accent-pink': '#E7A8BB',
                        'accent-gold': '#F2C94C',
                    }
                } 
            } 
        }
    </script>
    <style>
        body { 
            background-color: #191C26; 
            color: #ffffff; 
            -webkit-font-smoothing: antialiased;
        }

        /* 힙한 카드 디자인 */
        .trendy-card {
            background: #242837;
            border-radius: 32px;
            padding: 16px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }
        .trendy-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 50px -10px rgba(0, 0, 0, 0.5);
        }

        /* 파스텔 그라데이션 이미지 박스 */
        .img-box {
            border-radius: 24px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        
        /* 등급별 배경 컬러 */
        .bg-common { background: linear-gradient(145deg, #E4B5C6, #A89BCA); }
        .bg-rare { background: linear-gradient(145deg, #9CE2E8, #7193DE); }
        .bg-ultra { background: linear-gradient(145deg, #FAD982, #DF935C); }

        .showroom-image {
            max-height: 95%;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .trendy-card:hover .showroom-image {
            transform: scale(1.08) translateY(-5px);
        }

        /* 배지 스타일 */
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        
        .heart-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        /* 필 버튼 스타일 */
        .pill-btn {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 13px;
            font-weight: 800;
            padding: 14px 20px;
            border-radius: 99px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            width: 100%;
        }
        .pill-btn:hover { 
            background: white; 
            color: black; 
        }

        /* 탭 버튼 디자인 */
        .tab-btn {
            padding: 10px 24px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 800;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .tab-active { background: white; color: #191C26; }
        .tab-inactive { background: rgba(255, 255, 255, 0.1); color: white; }
        .tab-inactive:hover { background: rgba(255, 255, 255, 0.2); }
        .tab-ultra-active { background: #D4AF37; color: #191C26; }

        /* 아코디언 및 커스텀 스크롤 */
        .expand-grid { display: none; opacity: 0; transform: translateY(-10px); transition: 0.4s ease; }
        .expand-grid.active { display: grid; opacity: 1; transform: translateY(0); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <nav class="pt-8 pb-4 px-6 md:px-12 flex justify-between items-center z-50 relative">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-accent-pink to-purple-400 p-1">
                <div class="w-full h-full bg-card-bg rounded-full flex items-center justify-center font-black text-xs overflow-hidden">
                    IJ
                </div>
            </div>
            <div>
                <h1 class="text-sm font-black text-white tracking-wide">Hello, Juicy</h1>
                <p class="text-[11px] text-gray-400 font-semibold mt-0.5">Explore The Archive</p>
            </div>
        </div>
        <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center cursor-pointer hover:bg-white/20 transition">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </div>
    </nav>

    <div class="px-6 md:px-12 mt-4 mb-6 relative z-40">
        <div class="bg-card-bg rounded-full py-4 px-6 flex items-center gap-3 border border-white/5 shadow-lg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span class="text-sm text-gray-400 font-semibold">Search NFT or collection...</span>
        </div>
    </div>

    <div class="px-6 md:px-12 mb-8 flex gap-3 overflow-x-auto no-scrollbar z-40 relative">
        <button id="btn-heads" class="tab-btn tab-active" onclick="switchTab('heads')">All Heads</button>
        <button id="btn-outfits" class="tab-btn tab-inactive" onclick="switchTab('outfits')">Outfits</button>
        <button id="btn-ultra" class="tab-btn tab-inactive flex items-center gap-1" onclick="switchTab('ultra')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg> Ultra
        </button>
    </div>

    <main class="px-6 md:px-12 pb-40 relative z-10 max-w-screen-2xl mx-auto">
        <div class="flex justify-between items-end mb-6 px-2">
            <h2 class="text-2xl font-black tracking-tight">All Collection</h2>
            <span class="text-xs font-bold text-gray-400 cursor-pointer hover:text-white transition">See All</span>
        </div>

        <div id="sec-heads" class="section-container">
            <div id="dynamic-fruits-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="sec-outfits" class="section-container hidden">
            <div class="grid grid-cols-1 gap-6">
                <div class="bg-card-bg rounded-[32px] p-5 cursor-pointer hover:-translate-y-1 transition-transform border border-white/5" onclick="toggleExpand('grid-cloth-common')">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#E4B5C6] to-[#A89BCA] p-1 flex justify-center items-end overflow-hidden">
                                <img src="./images/Navy sweater cross pose 1#10.png" class="w-full object-contain drop-shadow-md -mb-2">
                            </div>
                            <div>
                                <h3 class="text-xl font-black">Navy Sweaters</h3>
                                <p class="text-xs text-gray-400 font-semibold mt-1">Essential Outfit Collection</p>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                </div>
                <div id="grid-cloth-common" class="expand-grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8"></div>

                <div class="bg-card-bg rounded-[32px] p-5 cursor-pointer hover:-translate-y-1 transition-transform border border-white/5" onclick="toggleExpand('grid-cloth-rare')">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#9CE2E8] to-[#7193DE] p-1 flex justify-center items-end overflow-hidden">
                                <img src="./images/Astronaut suit pose 1#10.png" class="w-full object-contain drop-shadow-md -mb-2">
                            </div>
                            <div>
                                <h3 class="text-xl font-black">Rare Outfits</h3>
                                <p class="text-xs text-[#9CE2E8] font-semibold mt-1">Limited Edition Pieces</p>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                </div>
                <div id="grid-cloth-rare" class="expand-grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8"></div>
            </div>
        </div>

        <div id="sec-ultra" class="section-container hidden">
            <div class="mb-12">
                <div class="flex items-center gap-2 mb-6 px-2">
                    <div class="w-2 h-6 bg-[#FAD982] rounded-full"></div>
                    <h3 class="text-2xl font-black text-[#FAD982]">Ultra Heads</h3>
                </div>
                <div id="grid-ultra-heads" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            </div>
            <div>
                <div class="flex items-center gap-2 mb-6 px-2">
                    <div class="w-2 h-6 bg-[#FAD982] rounded-full"></div>
                    <h3 class="text-2xl font-black text-[#FAD982]">Ultra Outfits</h3>
                </div>
                <div id="grid-ultra-outfits" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            </div>
        </div>
    </main>

    <script>
        const COLLECTION_URL = "https://opensea.io/collection/inner-juicy";

        function getOpenseaLink(trait, value) {
            return `${COLLECTION_URL}?search[stringTraits][0][name]=${trait}&search[stringTraits][0][values][0]=${encodeURIComponent(value)}`;
        }

        // 아이콘 SVG 헬퍼
        const ethIcon = `<svg width="14" height="14" viewBox="0 0 320 512" fill="currentColor"><path d="M311.9 260.8L160 353.6 8 260.8 160 0l151.9 260.8zM160 383.4L8 290.6 160 512l152-221.4-152 92.8z"/></svg>`;

        // 과일 데이터
        const fruits = [
            { id: 'apple', name: 'Apple' }, { id: 'banana', name: 'Banana' },
            { id: 'strawberry', name: 'Strawberry' }, { id: 'kiwi', name: 'Kiwi' },
            { id: 'lemon', name: 'Lemon' }, { id: 'melon', name: 'Melon' },
            { id: 'blueberry', name: 'Blueberry' }, { id: 'peach', name: 'Peach' },
            { id: 'watermelon', name: 'Watermelon' }, { id: 'orange', name: 'Orange' },
            { id: 'pineapple', name: 'Pineapple' }
        ];

        // 1. Heads 메인 탭 렌더링
        const fruitContainer = document.getElementById('dynamic-fruits-container');
        fruits.forEach(f => {
            // 폴더 역할 카드
            fruitContainer.innerHTML += `
                <div class="bg-card-bg rounded-[32px] p-5 cursor-pointer hover:-translate-y-1 transition-all border border-white/5 group shadow-lg" onclick="toggleExpand('grid-${f.id}')">
                    <div class="flex items-center gap-4">
                        <div class="w-20 h-20 rounded-[20px] bg-common p-1 flex justify-center items-end overflow-hidden relative">
                            <img src="./images/${f.id}-common.png" class="w-full object-contain drop-shadow-md -mb-2 group-hover:scale-110 transition duration-500">
                        </div>
                        <div class="flex-1">
                            <p class="text-[#E7A8BB] text-[10px] font-bold uppercase tracking-wider mb-1 flex items-center gap-1">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"></circle></svg> Collection
                            </p>
                            <h3 class="text-2xl font-black">${f.name}</h3>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white group-hover:bg-white group-hover:text-black transition">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                </div>
                <div id="grid-${f.id}" class="expand-grid col-span-full grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 pt-2 pb-8">
                    ${renderHeadItems(f)}
                </div>
            `;
        });

        function renderHeadItems(f) {
            const os = getOpenseaLink('fruit_head', f.name);
            return `
                <div class="trendy-card group">
                    <div class="img-box bg-common">
                        <div class="badge">Common</div>
                        <div class="heart-icon">♡</div>
                        <img src="./images/${f.id}-common.png" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">${f.name} Common</h4>
                        <div class="flex items-center gap-2 mt-1 text-gray-400 text-[11px] font-semibold">
                            By Inner Juicy
                        </div>
                    </div>
                    <a href="${os}" target="_blank" class="pill-btn group-hover:bg-white group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Place Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>

                <div class="trendy-card group">
                    <div class="img-box bg-rare">
                        <div class="badge border-[#9CE2E8] text-[#9CE2E8]">Rare</div>
                        <div class="heart-icon">♡</div>
                        <img src="./images/${f.id}-rare-headset.png" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">${f.name} Headset</h4>
                        <div class="flex items-center gap-2 mt-1 text-gray-400 text-[11px] font-semibold">
                            By Inner Juicy
                        </div>
                    </div>
                    <a href="${os}" target="_blank" class="pill-btn group-hover:bg-white group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Place Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>

                <div class="trendy-card group">
                    <div class="img-box bg-rare">
                        <div class="badge border-[#9CE2E8] text-[#9CE2E8]">Rare</div>
                        <div class="heart-icon">♡</div>
                        <img src="./images/${f.id}-rare-sunglasses.png" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">${f.name} Glasses</h4>
                        <div class="flex items-center gap-2 mt-1 text-gray-400 text-[11px] font-semibold">
                            By Inner Juicy
                        </div>
                    </div>
                    <a href="${os}" target="_blank" class="pill-btn group-hover:bg-white group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Place Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>

                <div class="trendy-card group">
                    <div class="img-box bg-ultra">
                        <div class="badge border-[#FAD982] text-[#FAD982]">Ultra</div>
                        <div class="heart-icon text-[#FAD982]">★</div>
                        <img src="./images/${f.id}-ultra-1.png" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">${f.name} Ultra A</h4>
                        <div class="flex items-center gap-2 mt-1 text-gray-400 text-[11px] font-semibold">
                            By Inner Juicy
                        </div>
                    </div>
                    <a href="${os}" target="_blank" class="pill-btn group-hover:bg-[#FAD982] group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Make Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>

                <div class="trendy-card group">
                    <div class="img-box bg-ultra">
                        <div class="badge border-[#FAD982] text-[#FAD982]">Ultra</div>
                        <div class="heart-icon text-[#FAD982]">★</div>
                        <img src="./images/${f.id}-ultra-2.png" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">${f.name} Ultra B</h4>
                        <div class="flex items-center gap-2 mt-1 text-gray-400 text-[11px] font-semibold">
                            By Inner Juicy
                        </div>
                    </div>
                    <a href="${os}" target="_blank" class="pill-btn group-hover:bg-[#FAD982] group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Make Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>
            `;
        }

        // 2. Outfits 렌더링
        const commonFiles = ['Navy sweater cross pose 1#10.png', 'Navy sweater cross pose 2#10.png', 'Navy sweater cross pose 3#10.png', 'Navy sweater handshake pose#10.png'];
        const rareFiles = [
            {t:'Astronaut', f:'Astronaut suit pose 1#10.png'}, {t:'Hoodie', f:'hoodie handshake pose 1#10.png'}, 
            {t:'Leather', f:'leather jacket candy pose#10.png'}, {t:'Green', f:'green sweater cross pose#10.png'}
        ];

        const commonGrid = document.getElementById('grid-cloth-common');
        commonFiles.forEach(file => {
            commonGrid.innerHTML += `
                <div class="trendy-card group">
                    <div class="img-box bg-common">
                        <div class="badge">Essential</div>
                        <div class="heart-icon">♡</div>
                        <img src="./images/${file}" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">Navy Sweater</h4>
                    </div>
                    <a href="${getOpenseaLink('outfits','Navy Sweater')}" target="_blank" class="pill-btn group-hover:bg-white group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Place Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>
            `;
        });

        const rareGrid = document.getElementById('grid-cloth-rare');
        rareFiles.forEach(item => {
            rareGrid.innerHTML += `
                <div class="trendy-card group">
                    <div class="img-box bg-rare">
                        <div class="badge border-[#9CE2E8] text-[#9CE2E8]">Rare</div>
                        <div class="heart-icon">♡</div>
                        <img src="./images/${item.f}" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">${item.t}</h4>
                    </div>
                    <a href="${getOpenseaLink('outfits', item.t)}" target="_blank" class="pill-btn group-hover:bg-white group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Place Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>
            `;
        });

        // 3. Ultra Archive 렌더링
        const uHeads = ["Amber", "Neon", "Void", "Molten", "Obsidian", "Aurora", "Sunset", "Ice", "Galaxy", "Toxic", "Darkmatter", "Chroma", "Electric", "Crystal", "Solar", "Diamond", "Plasma"];
        const uOutfits = ["Dragon Armor", "Jungle Vest", "Steampunk Vest", "Pharaoh", "Silver Spiked Punk", "Nebula Hood", "Gold Astronaut"];

        const uhGrid = document.getElementById('grid-ultra-heads');
        uHeads.forEach(name => {
            uhGrid.innerHTML += `
                <div class="trendy-card group">
                    <div class="img-box bg-ultra">
                        <div class="badge border-[#FAD982] text-[#FAD982]">Masterpiece</div>
                        <div class="heart-icon text-[#FAD982]">★</div>
                        <img src="./images/ultra_head_${name.toLowerCase()}.png" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">${name}</h4>
                    </div>
                    <a href="${getOpenseaLink('ultra_head', name)}" target="_blank" class="pill-btn group-hover:bg-[#FAD982] group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Make Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>
            `;
        });

        const uoGrid = document.getElementById('grid-ultra-outfits');
        uOutfits.forEach(name => {
            uoGrid.innerHTML += `
                <div class="trendy-card group">
                    <div class="img-box bg-ultra">
                        <div class="badge border-[#FAD982] text-[#FAD982]">Masterpiece</div>
                        <div class="heart-icon text-[#FAD982]">★</div>
                        <img src="./images/outfit_ultra_${name.toLowerCase().replace(/ /g, '_')}.png" class="showroom-image">
                    </div>
                    <div class="px-2 mb-4">
                        <h4 class="text-lg font-black tracking-tight">${name}</h4>
                    </div>
                    <a href="${getOpenseaLink('outfit', name)}" target="_blank" class="pill-btn group-hover:bg-[#FAD982] group-hover:text-black">
                        <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-[#191C26] text-white flex items-center justify-center">${ethIcon}</div> Make Bid</span>
                        <span class="opacity-50">View →</span>
                    </a>
                </div>
            `;
        });

        // 탭 전환 로직
        function switchTab(tab) {
            document.querySelectorAll('.section-container').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('tab-active', 'tab-ultra-active');
                b.classList.add('tab-inactive');
            });
            
            const activeBtn = document.getElementById(`btn-${tab}`);
            activeBtn.classList.remove('tab-inactive');
            if(tab === 'ultra') {
                activeBtn.classList.add('tab-ultra-active');
            } else {
                activeBtn.classList.add('tab-active');
            }
        }

        // 아코디언 로직
        function toggleExpand(id) {
            const el = document.getElementById(id);
            el.classList.toggle('active');
        }
    </script>
</body>
</html>
