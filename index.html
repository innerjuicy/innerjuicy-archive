<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Juicy | The Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0A0A0A; color: white; overflow-x: hidden; }
        .glass { background: rgba(20, 20, 20, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .album-cover { transition: all 0.3s ease; cursor: pointer; }
        .album-cover:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.3); }
        .inner-item { transition: all 0.3s ease; position: relative; display: flex; align-items: center; justify-content: center; overflow: visible; }
        .inner-item:hover { transform: scale(1.03); }
        
        /* 등급별 전시장 그림자 효과 */
        .showroom-image {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        /* 1단계: Common (은은한 진열 효과) */
        .inner-item-common:hover { border-color: rgba(192, 192, 192, 0.3); }
        .inner-item-common .showroom-image { filter: drop-shadow(0 10px 15px rgba(192, 192, 192, 0.25)); }
        .inner-item-common:hover .showroom-image { filter: drop-shadow(0 15px 25px rgba(192, 192, 192, 0.45)); transform: translateY(-5px); }

        /* 2단계: Rare (Cyan 색수차 & 후광 효과) */
        .inner-item-rare:hover { border-color: rgba(0, 255, 255, 0.4); }
        .inner-item-rare .showroom-image { filter: drop-shadow(0 10px 15px rgba(0, 255, 255, 0.35)); }
        .inner-item-rare:hover .showroom-image { filter: drop-shadow(0 20px 30px rgba(0, 255, 255, 0.65)); transform: translateY(-5px) scale(1.05); }

        /* 3단계: Ultra (Purple Aura & 바닥 반사 & 맥박 애니메이션) */
        .inner-item-ultra:hover { border-color: rgba(128, 0, 128, 0.5); }
        .inner-item-ultra .showroom-image { filter: drop-shadow(0 15px 25px rgba(128, 0, 128, 0.45)); }
        .inner-item-ultra:hover .showroom-image {
            filter: drop-shadow(0 30px 50px rgba(128, 0, 128, 0.85));
            transform: translateY(-8px);
            animation: ultra-pulse 1.5s infinite;
        }

        @keyframes ultra-pulse {
            0%, 100% { filter: drop-shadow(0 30px 50px rgba(128, 0, 128, 0.85)); }
            50% { filter: drop-shadow(0 30px 60px rgba(128, 0, 128, 1)); }
        }

        .border-common { border-bottom: 3px solid #C0C0C0; }
        .border-rare { border-bottom: 3px solid #00FFFF; }
        .border-ultra { border-bottom: 3px solid #800080; }
        
        .expand-grid { display: none; opacity: 0; transform: translateY(-10px); transition: opacity 0.4s ease, transform 0.4s ease; }
        .expand-grid.active { display: grid; opacity: 1; transform: translateY(0); }
        .text-gradient { background: linear-gradient(135deg, #fff 0%, #a8a8a8 50%, #fff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .os-btn { background: rgba(32, 129, 226, 0.8); backdrop-filter: blur(4px); transition: all 0.2s; }
        .os-btn:hover { background: rgba(32, 129, 226, 1); transform: scale(1.05); box-shadow: 0 0 20px rgba(32,129,226,0.6); }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed w-full top-0 z-40 glass border-b-0 border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold tracking-widest uppercase">Inner Juicy</div>
        <a href="https://innerjuicy-mint.netlify.app/" target="_blank" class="text-sm font-semibold tracking-wider hover:text-gray-300">Minting Site ↗</a>
    </nav>

    <header class="pt-40 pb-16 flex flex-col items-center text-center px-4 relative">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-white/5 rounded-full blur-[100px] pointer-events-none"></div>
        <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-4 relative z-10 text-gradient">THE ARCHIVE</h1>
        <p class="text-gray-400 text-lg font-light relative z-10">Explore the core assets. Click a collection to expand.</p>
    </header>

    <div class="flex justify-center gap-4 mb-16 relative z-10">
        <button id="btn-heads" class="tab-btn px-8 py-3 rounded-full glass bg-white/10 font-bold tracking-wide transition-all text-white" onclick="switchTab('heads')">🍎 FRUIT HEADS</button>
        <button id="btn-outfits" class="tab-btn px-8 py-3 rounded-full glass hover:bg-white/5 font-bold tracking-wide transition-all text-gray-400" onclick="switchTab('outfits')">👕 OUTFITS</button>
    </div>

    <main class="max-w-6xl mx-auto px-6 pb-32 relative z-10">
        <div id="sec-heads" class="section-container">
            <div id="dynamic-fruits-container"></div>
        </div>

        <div id="sec-outfits" class="section-container hidden">
            <div class="text-center py-20 text-gray-500">
                <p>Outfit assets are being prepared.</p>
            </div>
        </div>
    </main>

    <script>
        const COLLECTION_URL = "https://opensea.io/collection/inner-juicy";

        function getOpenseaLink(traitType, traitValue) {
            const encodedValue = encodeURIComponent(traitValue);
            return `${COLLECTION_URL}?search[stringTraits][0][name]=${traitType}&search[stringTraits][0][values][0]=${encodedValue}`;
        }

        function getHoverOverlay(badgeLabel, badgeColorClass, linkUrl) {
            return `
                <div class="absolute inset-0 bg-black/80 flex flex-col justify-center items-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="text-xs font-bold ${badgeColorClass} mb-3 text-center px-2">${badgeLabel}</span>
                    <a href="${linkUrl}" target="_blank" onclick="event.stopPropagation()" class="os-btn px-4 py-2 rounded-lg text-white text-xs font-bold shadow-[0_0_15px_rgba(32,129,226,0.5)]">
                        Buy on OpenSea ↗
                    </a>
                </div>
            `;
        }

        // 과일 데이터
        const fruits = [
            { id: 'apple', icon: '🍎', name: 'Apple' }, { id: 'banana', icon: '🍌', name: 'Banana' },
            { id: 'strawberry', icon: '🍓', name: 'Strawberry' }, { id: 'kiwi', icon: '🥝', name: 'Kiwi' },
            { id: 'lemon', icon: '🍋', name: 'Lemon' }, { id: 'melon', icon: '🍈', name: 'Melon' },
            { id: 'blueberry', icon: '🫐', name: 'Blueberry' }, { id: 'peach', icon: '🍑', name: 'Peach' },
            { id: 'watermelon', icon: '🍉', name: 'Watermelon' }, { id: 'orange', icon: '🍊', name: 'Orange' },
            { id: 'pineapple', icon: '🍍', name: 'Pineapple' }
        ];

        const fruitContainer = document.getElementById('dynamic-fruits-container');
        fruits.forEach(f => {
            const osLinkHeads = getOpenseaLink('fruit_head', f.name);
            const html = `
                <div class="album-cover glass rounded-2xl p-6 mb-4 flex justify-between items-center" onclick="toggleExpand('grid-${f.id}')">
                    <div class="flex items-center gap-6"><div class="w-16 h-16 bg-gray-800 rounded-xl flex items-center justify-center text-2xl">${f.icon}</div>
                    <div><h2 class="text-xl font-bold">${f.name} Collection</h2><p class="text-gray-400 text-sm">Common & Rare Types</p></div></div><div class="drop-icon font-bold text-xl">+</div>
                </div>
                <div id="grid-${f.id}" class="expand-grid grid-cols-2 md:grid-cols-4 gap-4 mb-12 pl-6 md:pl-24 relative overflow-visible">
                    
                    <div class="inner-item inner-item-common glass rounded-xl h-48 overflow-visible relative group border-common flex items-center justify-center p-4">
                        <img src="./images/${f.id}-common.png" class="showroom-image" onerror="this.style.display='none'">
                        ${getHoverOverlay('Common', 'text-gray-300', osLinkHeads)}
                    </div>
                    
                    <div class="inner-item inner-item-rare glass rounded-xl h-48 overflow-visible relative group border-rare flex items-center justify-center p-4">
                        <img src="./images/${f.id}-rare-headset.png" class="showroom-image" onerror="this.style.display='none'">
                        ${getHoverOverlay('Rare (Headset)', 'text-cyan-400', osLinkHeads)}
                    </div>

                    <div class="inner-item inner-item-rare glass rounded-xl h-48 overflow-visible relative group border-rare flex items-center justify-center p-4">
                        <img src="./images/${f.id}-rare-sunglasses.png" class="showroom-image" onerror="this.style.display='none'">
                        ${getHoverOverlay('Rare (Sunglasses)', 'text-cyan-400', osLinkHeads)}
                    </div>

                </div>
            `;
            fruitContainer.insertAdjacentHTML('beforeend', html);
        });

        function switchTab(tabName) {
            const btnHeads = document.getElementById('btn-heads');
            const btnOutfits = document.getElementById('btn-outfits');
            
            btnHeads.className = 'tab-btn px-8 py-3 rounded-full glass font-bold tracking-wide transition-all ' + (tabName === 'heads' ? 'bg-white/10 text-white' : 'hover:bg-white/5 text-gray-400');
            btnOutfits.className = 'tab-btn px-8 py-3 rounded-full glass font-bold tracking-wide transition-all ' + (tabName === 'outfits' ? 'bg-white/10 text-white' : 'hover:bg-white/5 text-gray-400');
            
            document.getElementById('sec-heads').style.display = tabName === 'heads' ? 'block' : 'none';
            document.getElementById('sec-outfits').style.display = tabName === 'outfits' ? 'block' : 'none';
            
            document.querySelectorAll('.expand-grid').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.drop-icon').forEach(el => el.style.transform = 'rotate(0deg)');
        }

        function toggleExpand(gridId) {
            const grid = document.getElementById(gridId);
            const icon = grid.previousElementSibling.querySelector('.drop-icon');
            
            if(grid.classList.contains('active')) {
                grid.classList.remove('active');
                icon.style.transform = 'rotate(0deg)';
            } else {
                grid.classList.add('active');
                icon.style.transform = 'rotate(45deg)';
            }
        }
    </script>
</body>
</html>
